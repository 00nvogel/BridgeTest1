name: Verify embedded package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r .sanitizer-bridge/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: .sanitizer-bridge
        env:
          PYTHONPATH: engine
          PYTHONDONTWRITEBYTECODE: '1'
